name: deploy

# On every push to main: sync the repo to the cloud box over SSH and
# `docker compose up -d --build`, then gate on the container becoming healthy.
# See deploy/DEPLOY.md for the one-time setup (deploy key, .env, repo secrets).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Never let two deploys run at once; queue instead of cancelling a live rollout.
concurrency:
  group: deploy-cloud
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/toggl-mcp

jobs:
  # Gate the rollout on the test suite. Back-fill writes to an official timesheet, so a broken
  # dedup must never reach the box that holds the live Toggl token.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test TogglMcp.slnx --configuration Release

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Sync repo to cloud
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          rsync -az --delete \
            --exclude '.git/' --exclude '.env' --exclude 'data/' \
            --exclude 'bin/' --exclude 'obj/' --exclude '**/bin/' --exclude '**/obj/' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Compose up + health gate
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -f .env || { echo "::error::$DEPLOY_PATH/.env missing on cloud — create it (see DEPLOY.md)"; exit 1; }
          docker compose up -d --build
          echo "Waiting for toggl-mcp to become healthy..."
          for i in $(seq 1 40); do
            status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}nohealth{{end}}' toggl-mcp 2>/dev/null || echo missing)"
            echo "  [$i] health=$status"
            case "$status" in
              healthy) echo "Deploy OK."; exit 0 ;;
              unhealthy) echo "::error::container unhealthy"; docker compose logs --tail=80 toggl-mcp; exit 1 ;;
            esac
            sleep 3
          done
          echo "::error::timed out waiting for health"
          docker compose logs --tail=80 toggl-mcp
          exit 1
          REMOTE
