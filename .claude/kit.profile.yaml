# claude-kit profile — toggl-mcp
# Read only by the optional claude-kit plugin; without it this file does nothing.
# A Toggl <-> Claude MCP server. NOTE: this is an MCP tool server, not an HTTP/EF web
# API, so the vsa_dotnet pack is applied in adapted form. The adapted rule-set is this
# repo's own skill: .claude/skills/mcp-slice-architecture/ (gated via skill_routes below).

project:
  name: toggl-mcp
  stack: dotnet
  kind: mcp-server

commands:
  build: "dotnet build TogglMcp.slnx"
  test: "dotnet test TogglMcp.slnx"

# The first edit under Features/ is denied until this repo's own slice rule-set has been
# invoked. One row: it is the only rule-set that shapes the code here.
skill_routes:
  - { glob: "src/TogglMcp/Features/**", skill: mcp-slice-architecture, why: "a slice here is one MCP tool, not a web endpoint" }

git:
  trunk: main
  can_push: true      # owner-authorised pushes to PetrValik/toggl-mcp (public, archived: unarchive first)
  pr: false

packs:
  vsa_dotnet:
    enabled: true
    modules_root: src/TogglMcp/Features   # single flat module; one slice folder per MCP tool
    features:
      multi_tenant: false                 # no tenant accessor / global query filter
      outbox: false                       # no outbox table / SaveChanges interceptor
    notes: >
      Adapted VSA for an MCP tool server. The rule-set moved to this repo's own skill,
      .claude/skills/mcp-slice-architecture/ — a profile note is a value field no routing
      mechanism can load. Read the skill; do not restate it here.
